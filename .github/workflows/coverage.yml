name: Per-module coverage

# On a normal push/PR, this workflow only tests and generates coverage
# for the game module(s) that actually changed. Each module's coverage is
# uploaded as its own artifact (coverage-<module>) so that a later job
# can assemble a full-repo coverage picture by combining this run's
# artifacts with the most recent artifact for every module that *wasn't*
# touched. A manual workflow_dispatch run bypasses the filter and tests
# every module, to seed or refresh a full baseline.
on:
  push:
    branches: [main]
  pull_request:
  # Lets anyone force a full baseline run — every module tested and
  # uploaded in one go, bypassing the changed-files filter below. Useful
  # for seeding/refreshing Codacy's coverage picture for all 5 modules at
  # once, rather than waiting for each one to be touched naturally.
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tic-tac-toe: ${{ steps.filter.outputs.tic-tac-toe }}
      hangman: ${{ steps.filter.outputs.hangman }}
      rock-paper-scissors: ${{ steps.filter.outputs.rock-paper-scissors }}
      guess-the-number: ${{ steps.filter.outputs.guess-the-number }}
      blackjack: ${{ steps.filter.outputs.blackjack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tic-tac-toe:
              - 'games/tic_tac_toe/**'
            hangman:
              - 'games/hangman/**'
            rock-paper-scissors:
              - 'games/rock_paper_scissors/**'
            guess-the-number:
              - 'games/guess_the_number/**'
            blackjack:
              - 'games/blackjack/**'

  test-tic-tac-toe:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.tic-tac-toe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: coverage run --source=games/tic_tac_toe -m pytest games/tic_tac_toe
      - run: coverage xml -o coverage-tic-tac-toe.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-tic-tac-toe
          path: coverage-tic-tac-toe.xml
          retention-days: 90
          overwrite: true

  test-hangman:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.hangman == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: coverage run --source=games/hangman -m pytest games/hangman
      - run: coverage xml -o coverage-hangman.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-hangman
          path: coverage-hangman.xml
          retention-days: 90
          overwrite: true

  test-rock-paper-scissors:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.rock-paper-scissors == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/rock_paper_scissors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go test ./... -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-rock-paper-scissors
          path: games/rock_paper_scissors/coverage.out
          retention-days: 90
          overwrite: true

  test-guess-the-number:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.guess-the-number == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/guess_the_number
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go test ./... -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-guess-the-number
          path: games/guess_the_number/coverage.out
          retention-days: 90
          overwrite: true

  test-blackjack:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.blackjack == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/blackjack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go test ./... -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-blackjack
          path: games/blackjack/coverage.out
          retention-days: 90
          overwrite: true

  # Runs on every push to main, regardless of which (if any) module jobs
  # above actually ran. For each of the 5 modules it fetches the most
  # recent coverage-<module> artifact (this run's, if that module was just
  # tested above; otherwise the latest one on record) and uploads all 5 to
  # Codacy as partial reports for this commit, then finalizes — so Codacy
  # always sees a complete, up-to-date coverage picture even though only
  # the touched module was actually re-tested.
  merge-and-upload-coverage:
    needs:
      - test-tic-tac-toe
      - test-hangman
      - test-rock-paper-scissors
      - test-guess-the-number
      - test-blackjack
    # Codacy expects a coverage upload on every commit, not just on main,
    # so this runs regardless of event type — the commit-uuid below makes
    # sure a pull_request run reports against the PR's actual head commit
    # rather than GitHub's synthetic merge-ref SHA.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest coverage artifact for every module
        run: |
          set -e
          ./scripts/ci/fetch_latest_artifact.sh coverage-tic-tac-toe coverage/tic-tac-toe
          ./scripts/ci/fetch_latest_artifact.sh coverage-hangman coverage/hangman
          ./scripts/ci/fetch_latest_artifact.sh coverage-rock-paper-scissors coverage/rock-paper-scissors
          ./scripts/ci/fetch_latest_artifact.sh coverage-guess-the-number coverage/guess-the-number
          ./scripts/ci/fetch_latest_artifact.sh coverage-blackjack coverage/blackjack

      # Python (cobertura xml) and Go (native go test profile) can't be
      # merged into one upload call: the Go profile needs an explicit
      # --force-coverage-parser go, which would wrongly apply to the
      # Python reports too if they were all passed to a single call. So
      # each report is sent as its own --partial upload with the right
      # parser, then one `final` tells Codacy all partials for this
      # commit are in. The reporter CLI resolves the commit itself from
      # the GitHub Actions context (correctly using the PR's head commit
      # on pull_request events, not the synthetic merge-ref GITHUB_SHA).
      - name: Upload each module's coverage to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -e
          reporter() { bash <(curl -Ls https://coverage.codacy.com/get.sh) "$@"; }
          uploaded=0

          upload() {
            local file=$1; shift
            if [ -f "$file" ]; then
              reporter report --partial "$@" -r "$file"
              uploaded=1
            fi
          }

          upload coverage/tic-tac-toe/coverage-tic-tac-toe.xml
          upload coverage/hangman/coverage-hangman.xml
          upload coverage/rock-paper-scissors/coverage.out --force-coverage-parser go
          upload coverage/guess-the-number/coverage.out --force-coverage-parser go
          upload coverage/blackjack/coverage.out --force-coverage-parser go

          if [ "$uploaded" = "1" ]; then
            reporter final
          else
            echo "No coverage reports available yet for this commit; skipping Codacy upload."
          fi
